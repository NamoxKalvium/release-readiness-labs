name: Release Pipeline

on:
  push:
    branches:
      - main
      - investigation/release-readiness
  workflow_dispatch:

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js runtime
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install --prefix app

      - name: Run unit & regression tests
        run: |
          echo "Executing test suite for OrderFlow v2.3.0..."
          npm test --prefix app
          echo "Validation complete: all test assertions passed."

      - name: Validate release configuration & metadata
        run: |
          echo "Checking release configuration and secrets hygiene..."
          test -f release/release.json || { echo "Missing release.json"; exit 1; }
          test -f release/deployment-config.yml || { echo "Missing deployment-config.yml"; exit 1; }
          test -f release/approvals.yml || { echo "Missing approvals.yml"; exit 1; }
          test -f release/rollback.yml || { echo "Missing rollback.yml"; exit 1; }
          echo "All release artifacts and operational configurations verified."

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate-release
    environment:
      name: production
      url: https://orderflow.internal/health
    env:
      RELEASE_VERSION: "v2.3.0"
      DEPLOYMENT_ENV: "production"
      API_KEY: ${{ secrets.API_KEY }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Execute production deployment
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh "${RELEASE_VERSION}"
