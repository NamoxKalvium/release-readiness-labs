apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow-app
  namespace: orderflow-prod
  labels:
    app: orderflow
    version: v2.3.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: orderflow
  template:
    metadata:
      labels:
        app: orderflow
        version: v2.3.0
    spec:
      containers:
      - name: orderflow
        image: ghcr.io/kalviumcommunity/orderflow:v2.3.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        env:
        - name: NODE_ENV
          value: "production"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: orderflow-secrets
              key: api-key
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orderflow-secrets
              key: database-password
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: orderflow-secrets
              key: token
        - name: AWS_SECRET
          valueFrom:
            secretKeyRef:
              name: orderflow-secrets
              key: aws-secret
